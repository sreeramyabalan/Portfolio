<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: pastel portfolio after the owner's sample. Top nav, hero with blob portrait area, then a three-column "dashboard" (sidebar tabs | active panel | skills + featured projects). Content lives in the JSON state; editors can edit in place and save. */
:root{
  --bg:#EEF1FB; --bg2:#F6F7FD; --surface:#FFFFFF; --soft:#E6EAFA; --line:#DCE1F3;
  --ink:#0F1A4F; --text:#2B3566; --muted:#5F6895;
  --primary:#22348F; --primary-ink:#FFFFFF; --blob:#D7DBFA; --mint:#CDEBDF; --leaf:#1E6A4E;
  --tile1:#5BAE8C; --tile2:#5B83C9; --tile3:#9A86D4; --ok:#3C9A66;
  --head:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1230; --bg2:#121739; --surface:#171D44; --soft:#20285A; --line:#2A336A;
  --ink:#EEF0FF; --text:#CDD3F5; --muted:#98A0CC;
  --primary:#8EA0FF; --primary-ink:#0E1230; --blob:#28306A; --mint:#1D4A3C; --leaf:#7FCBA8;
  --tile1:#3E8E6E; --tile2:#4569A8; --tile3:#7663B3; --ok:#6CCB95; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1230; --bg2:#121739; --surface:#171D44; --soft:#20285A; --line:#2A336A;
  --ink:#EEF0FF; --text:#CDD3F5; --muted:#98A0CC;
  --primary:#8EA0FF; --primary-ink:#0E1230; --blob:#28306A; --mint:#1D4A3C; --leaf:#7FCBA8;
  --tile1:#3E8E6E; --tile2:#4569A8; --tile3:#7663B3; --ok:#6CCB95; color-scheme:dark}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--head);font-size:16px;line-height:1.6}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.inner{max-width:1240px;margin:0 auto}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:8px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.nav .inner{display:flex;align-items:center;gap:24px;min-height:76px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;white-space:nowrap;font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.1}
.brand small{display:block;font-size:.88rem;color:var(--primary);font-weight:500}
.links{display:flex;gap:6px;margin-left:auto}
.links button{background:none;border:0;padding:10px 11px;white-space:nowrap;font-weight:500;cursor:pointer;color:var(--text);position:relative}
.links button[aria-current="true"]{color:var(--primary);font-weight:700}
.links button[aria-current="true"]::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:3px;border-radius:3px;background:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 24px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;border:1.5px solid var(--primary);white-space:nowrap}
.btn.solid{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--surface);color:var(--primary)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.nav .btn{margin-left:8px}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg2),var(--bg))}
.hero::before{content:"";position:absolute;left:-120px;bottom:-140px;width:360px;height:320px;border-radius:50%;background:var(--blob);opacity:.7}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:200px;border-radius:0 0 0 70%;background:var(--mint);opacity:.8}
.hero .inner{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:64px 56px}
.hero-r{position:relative;display:grid;place-items:center;min-width:0}
.frame{position:relative;width:min(420px,100%);aspect-ratio:1/1;max-width:100%}
.frame::before{content:"";position:absolute;inset:-4% -6% -6% -4%;background:var(--blob);border-radius:46% 54% 42% 58% / 52% 44% 56% 48%}
.frame img{position:relative;width:100%;height:100%;object-fit:cover;object-position:50% 30%;border-radius:50%;border:6px solid var(--surface);box-shadow:0 18px 40px color-mix(in srgb,var(--primary) 18%,transparent)}
.frame .leafs{position:absolute;right:-6%;bottom:-2%;width:22%;height:auto}

.hero-l{display:flex;flex-direction:column;gap:18px;min-width:0}
.hello{font-size:1.6rem;font-weight:600;color:var(--ink)}
h1.name{font-size:clamp(2.6rem,6vw,4.2rem);font-weight:800;letter-spacing:-.02em}
.sub{display:flex;flex-direction:column;gap:2px;font-size:1.12rem;color:var(--ink)}
.intro{font-size:1.08rem;max-width:68ch;color:var(--text)}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:18px}
.facts .fact{border-right:0;margin-right:0;padding-right:0}
.fact{display:flex;gap:12px;align-items:flex-start;padding-right:22px;margin-right:22px;border-right:1px solid var(--line);min-width:0}
.fact:last-child{border-right:0;margin-right:0;padding-right:0}
.fact .ic{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--primary);flex:none;box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 12%,transparent)}
.fact b{display:block;font-size:.92rem;color:var(--ink);font-weight:600}
.fact small{display:block;font-size:.8rem;color:var(--muted)}


/* dashboard */
.dash{min-height:60vh}
.dash .inner{max-width:920px;padding-block:40px 64px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
.tabs{display:flex;flex-direction:column;gap:6px}
.tab{display:flex;align-items:center;gap:14px;background:none;border:0;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:500;color:var(--ink)}
.tab .ic{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);flex:none}
.tab[aria-selected="true"]{background:var(--soft);color:var(--primary);font-weight:700}
.tab[aria-selected="true"] .ic{background:var(--primary);color:var(--primary-ink)}
.tab:hover{background:var(--soft)}
.side-note{font-family:var(--hand);font-size:1.55rem;line-height:1.1;color:var(--ink);padding:28px 10px 6px;white-space:pre-line;transform:rotate(-4deg)}
.side-note svg{display:block;width:80px;height:20px;color:var(--primary);margin-top:4px}

.rightcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{display:flex;flex-direction:column;gap:22px;min-width:0}
.ph{display:flex;align-items:center;gap:12px}
.ph .ic{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.ph h2{font-size:1.7rem;font-weight:800}
.lead{font-size:1.04rem;max-width:62ch;white-space:pre-line}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:8px}
.grid4 .fact{border:0;margin:0;padding:14px 16px}
.grid4 .fact:nth-child(odd){border-right:1px solid var(--line)}
h3.sh{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:10px}
h3.sh svg{color:#E8A93B;fill:#F2C14E;stroke:#E8A93B}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;color:var(--text)}
.checks li .ck{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;margin-top:3px}
.checks li .ck svg{width:12px;height:12px;stroke-width:3}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card h3{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:10px}
.card h3 svg{color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.92rem;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chips.big .chip{font-size:1rem;padding:9px 18px}

.proj{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.proj .tile{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff}
.proj b{display:block;color:var(--ink);font-size:.98rem}
.proj small{display:block;color:var(--muted);font-size:.85rem;line-height:1.4}
.proj a.go{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink);text-decoration:none}
.proj a.go:hover{background:var(--soft)}
.proj .go.off{opacity:.3}
.wide{width:100%;justify-content:center}

.projgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.projcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.projcard .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.projcard b{color:var(--ink);font-size:1.05rem}
.projcard .lk{font-size:.9rem;font-weight:600;color:var(--primary);text-decoration:none;margin-top:auto}

.timeline{display:flex;flex-direction:column;gap:14px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.job-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.job b{color:var(--ink);font-size:1.08rem}
.job .when{font-size:.85rem;color:var(--primary);font-weight:600;font-variant-numeric:tabular-nums}
.job .org{color:var(--muted);font-size:.93rem}
.job ul{margin:4px 0 0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
.job li::marker{color:var(--primary)}

.certs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.certs li{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.status{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border:0;cursor:default}
.status.prog{background:var(--soft);color:var(--muted)}
.certs .src{color:var(--muted);font-size:.9rem}

.contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ct{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.ct .ic{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}
.ct div{min-width:0}
.ct small{display:block;color:var(--muted);font-size:.8rem}
.ct span.v{display:block;color:var(--ink);font-weight:600;overflow-wrap:anywhere;user-select:all}
.ct .copy{margin-left:auto;background:var(--soft);border:0;border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:600;color:var(--primary);cursor:pointer}

footer{text-align:center;color:var(--muted);font-size:.85rem;padding-block:20px 32px}

/* edit mode */
.editfab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 8px 24px color-mix(in srgb,var(--primary) 30%,transparent)}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--ink);color:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.editbar .inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.editbar p{font-size:.92rem;margin-right:auto}
.editbar .btn{padding:9px 18px;font-size:.88rem}
.editbar .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.editbar .btn.solid{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.linkpanel{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:8px}
.linkpanel label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;opacity:.85}
.linkpanel input,.urlin{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
body.editing{padding-bottom:140px}
body.editing [data-k]{outline:1.5px dashed color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:3px;border-radius:4px;cursor:text}
body.editing [data-k]:focus{outline-style:solid;background:color-mix(in srgb,var(--primary) 6%,transparent)}
.x{border:0;background:color-mix(in srgb,#D9534F 14%,transparent);color:#C0392B;width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:700;line-height:1;flex:none}
.add{align-self:flex-start;border:1.5px dashed var(--primary);background:transparent;color:var(--primary);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
body.editing .status{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--primary-ink);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.92rem;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:1420px){
  .nav .inner{flex-wrap:wrap;gap:8px 16px}
  .links{order:3;width:100%;margin-left:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);padding-top:4px}
  .links button{flex:none}
  .nav .btn{margin-left:auto}
}
@media (max-width:860px){
  .nav .btn{margin-left:auto;padding:10px 16px}
  .hero .inner{grid-template-columns:1fr;padding-block:36px}
  .hero-r{order:-1}
  .frame{width:min(240px,70%)}
  .side{position:static;padding:10px}
  .tabs{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .tab{flex:none;padding:6px 12px 6px 6px}
  .tab .ic{width:32px;height:32px}
  .side-note{display:none}
  .rightcol{grid-template-columns:1fr}
  .grid4,.projgrid,.contacts,.linkpanel{grid-template-columns:1fr}
  .grid4 .fact:nth-child(odd){border-right:0}
  .facts{flex-direction:column;gap:14px}
  .fact{border-right:0;margin-right:0;padding-right:0}
}
@media (max-width:480px){.brand small{display:none}.nav .btn span{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>

    gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    code:'<path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/>',
    bag:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/>',
    link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    check:'<path d="M5 12l5 5 9-10"/>',
    star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
    down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    work:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/>',
    arrow:'<path d="M7 17L17 7M9 7h8v8"/>',
    right:'<path d="M5 12h14M13 6l6 6-6 6"/>',
    heart:'<path d="M12 20s-7-4.4-9-9a4.6 4.6 0 0 1 9-3 4.6 4.6 0 0 1 9 3c-2 4.6-9 9-9 9z"/>',
    trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM5 5h3v3a3 3 0 0 1-3-3zM19 5h-3v3a3 3 0 0 0 3-3zM12 13v4M8 20h8"/>'
  };
  function icon(n){ var s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','i'); s.setAttribute('aria-hidden','true'); s.innerHTML=ICONS[n]||ICONS.link; return s; }
  function el(tag, attrs, kids){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){ if(attrs[k]==null||attrs[k]===false) continue; if(k==='class') e.className=attrs[k]; else if(k==='text') e.textContent=attrs[k]; else e.setAttribute(k, attrs[k]===true?'':attrs[k]); }
    (kids||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function cur(){ return editing?draft:S; }
  function get(p){ return p.split('.').reduce(function(a,k){ return a==null?a:a[k]; }, cur()); }
  function setp(p,v){ var ks=p.split('.'), a=draft; for(var i=0;i<ks.length-1;i++) a=a[ks[i]]; a[ks[ks.length-1]]=v; }
  function T(tag, path, cls){ var e=el(tag,{class:cls}); e.textContent=get(path)||''; e.setAttribute('data-k',path); return e; }
  function X(path,i){ return editing ? el('button',{type:'button',class:'x','data-del':path,'data-i':i,'aria-label':'Remove',text:'×'}) : null; }
  function ADD(path,label){ return editing ? el('button',{type:'button',class:'add','data-add':path,text:'+ '+label}) : null; }
  function factEl(path){ var f=get(path); return el('div',{class:'fact'},[el('span',{class:'ic'},[icon(f.icon)]), el('div',null,[T('b',path+'.title'), T('small',path+'.sub')])]); }
  function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : null; }

  /* ---------- sections ---------- */
  function nav(){
    var leaf='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 34C12 30 8 22 11 12c6 3 10 10 9 22z" fill="var(--leaf)"/><path d="M20 34c8-4 12-12 9-22-6 3-10 10-9 22z" fill="var(--tile2)"/><path d="M20 34c-1-8 0-15 0-24" stroke="var(--surface)" stroke-width="1.4" fill="none"/></svg>';
    var brand=el('a',{class:'brand',href:'#','data-go':'home'}); brand.innerHTML=leaf;
    brand.appendChild(el('div',null,[T('b','name')]));
    var links=el('div',{class:'links'});
    [["home","Home"],["about","About"],["skills","Skills"],["projects","Projects"],["achievements","Achievements"],["experience","Experience"],["volunteering","Volunteering"],["education","Education"],["contact","Contact"]].forEach(function(l){
      links.appendChild(el('button',{type:'button','data-go':l[0],'aria-current':String(l[0]===tab),text:l[1]}));
    });
    var cta=el('button',{type:'button',class:'btn solid','data-go':'contact'},[icon('mail'),el('span',{text:'Contact Me'})]);
    return el('nav',{class:'nav gut',id:'top'},[el('div',{class:'inner'},[brand,links,cta])]);
  }

  function hero(){
    var sub=el('div',{class:'sub'}); get('subtitle').forEach(function(_,i){ sub.appendChild(T('div','subtitle.'+i)); });
    var resume=safeUrl(get('resumeUrl'));
    var dl = resume ? el('a',{class:'btn ghost',href:resume,target:'_blank',rel:'noopener'},[icon('down'),'Download Resume'])
                    : el('button',{type:'button',class:'btn ghost','data-go':'contact'},[icon('down'),'Request Resume']);
    var facts=el('div',{class:'facts'}); get('facts').forEach(function(_,i){ facts.appendChild(factEl('facts.'+i)); });
    var left=el('div',{class:'hero-l'},[T('p','hello','hello'),T('h1','name','name'),sub,T('p','intro','intro'),
      el('div',{class:'cta'},[el('button',{type:'button',class:'btn solid','data-go':'projects'},[icon('work'),'View My Work']),dl]),facts]);
    var src=document.getElementById('photo-src'), right=null;
    if(src && src.getAttribute('src')){
      var fr=el('div',{class:'frame'},[el('img',{src:src.getAttribute('src'),alt:'Photo of '+(get('name')||''),width:'640',height:'640'})]);
      fr.insertAdjacentHTML('beforeend','<svg class="leafs" viewBox="0 0 70 90" aria-hidden="true"><path d="M8 86C24 60 40 36 62 6" stroke="var(--ink)" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M30 52c-14-2-20-12-18-24 12 2 19 12 18 24zM44 34c-2-12 4-22 16-26 2 12-4 22-16 26zM40 42c12-4 22 0 26 10-12 4-22 0-26-10z" fill="var(--leaf)"/></svg>');
      right=el('div',{class:'hero-r'},[fr]);
    }
    return el('section',{class:'hero gut',id:'home'},[el('div',{class:'inner'},[left,right])]);
  }

  function sidebar(){
    var tabs=el('div',{class:'tabs',role:'tablist','aria-label':'Portfolio sections'});
    TABS.forEach(function(t){
      tabs.appendChild(el('button',{type:'button',class:'tab',role:'tab',id:'tab-'+t[0],'aria-selected':String(tab===t[0]),'aria-controls':'panel','data-tab':t[0]},[el('span',{class:'ic'},[icon(t[2])]),t[1]]));
    });
    var note=el('div',{class:'side-note'},[T('span','sideNote')]);
    note.insertAdjacentHTML('beforeend','<svg viewBox="0 0 80 20"><path d="M2 14c18-8 34 6 52-2 6-3 10-6 14-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M70 6l4 2-2 4" stroke="currentColor" stroke-width="2" fill="none"/></svg>');
    return el('aside',{class:'side'},[tabs,note]);
  }

  function ph(ic,title){ return el('div',{class:'ph'},[el('span',{class:'ic'},[icon(ic)]),el('h2',{text:title})]); }
  function checkList(path){
    var ul=el('ul',{class:'checks'});
    get(path).forEach(function(_,i){ ul.appendChild(el('li',null,[el('span',{class:'ck'},[icon('check')]),T('span',path+'.'+i),X(path,i)])); });
    return el('div',{style:'display:flex;flex-direction:column;gap:10px'},[ul,ADD(path,'Add item')]);
  }
  function chipList(path, big){
    var c=el('div',{class:'chips'+(big?' big':'')});
    get(path).forEach(function(_,i){ c.appendChild(el('span',{class:'chip'},[T('span',path+'.'+i),X(path,i)])); });
    if(editing) c.appendChild(ADD(path,'Add'));
    return c;
  }
  var TILE=['var(--tile1)','var(--tile2)','var(--tile3)'];

  function panel(){
    var p=el('div',{class:'panel',id:'panel',role:'tabpanel','aria-labelledby':'tab-'+tab});
    if(tab==='about'){
      var g=el('div',{class:'grid4'}); get('aboutFacts').forEach(function(_,i){ g.appendChild(factEl('aboutFacts.'+i)); });
      [ph('user','About Me'),T('p','about','lead'),g].forEach(function(n){p.appendChild(n);});
    } else if(tab==='skills'){
      [ph('gear','Skills'),
       el('div',{class:'card'},[el('h3',null,[icon('gear'),'Technical Skills']),chipList('skills',true)]),
       el('div',{class:'card'},[el('h3',null,[icon('user'),'Professional Skills']),chipList('softSkills',true)]),
       el('h3',{class:'sh'},[icon('star'),'What I Bring']),checkList('bring')].forEach(function(n){p.appendChild(n);});
    } else if(tab==='projects'){
      var pg=el('div',{class:'projgrid'});
      get('projects').forEach(function(pr,i){
        var u=safeUrl(pr.link), base='projects.'+i;
        pg.appendChild(el('article',{class:'projcard'},[
          el('div',{style:'display:flex;justify-content:space-between;gap:8px'},[el('span',{class:'tile',style:'background:'+TILE[i%3]},[icon(i%2?'work':'code')]),X('projects',i)]),
          T('b',base+'.title'),T('p',base+'.desc'),
          editing?el('input',{class:'urlin',type:'url',placeholder:'Project link (https://…)',value:pr.link||'','data-v':base+'.link','aria-label':'Project link'}):
            (u?el('a',{class:'lk',href:u,target:'_blank',rel:'noopener',text:'View project ↗'}):null)
        ]));
      });
      [ph('code','Projects'),pg,ADD('projects','Add project')].forEach(function(n){ if(n) p.appendChild(n);});
    } else if(tab==='achievements'){
      [ph('trophy','Achievements'),el('div',{class:'card'},[checkList('achievements')])].forEach(function(n){ if(n) p.appendChild(n);});
    } else if(tab==='experience' || tab==='volunteering'){
      var key=tab, tl=el('div',{class:'timeline'});
      get(key).forEach(function(_,i){
        var b=key+'.'+i, ul=el('ul');
        get(b+'.points').forEach(function(_,j){ ul.appendChild(el('li',null,[T('span',b+'.points.'+j),' ',X(b+'.points',j)])); });
        tl.appendChild(el('article',{class:'job'},[
          el('div',{class:'job-h'},[T('b',b+'.role'),el('span',{style:'display:flex;gap:8px;align-items:center'},[T('span',b+'.when','when'),X(key,i)])]),
          T('span',b+'.org','org'),ul,ADD(b+'.points','Add point')]));
      });
      [key==='experience'?ph('bag','Experience'):ph('heart','Volunteering'),tl,ADD(key,key==='experience'?'Add role':'Add volunteer role')].forEach(function(n){ if(n) p.appendChild(n);});
    } else if(tab==='education'){
      var ed=el('div',{class:'timeline'});
      get('education').forEach(function(_,i){ var b='education.'+i;
        ed.appendChild(el('article',{class:'job'},[el('div',{class:'job-h'},[T('b',b+'.title'),el('span',{style:'display:flex;gap:8px;align-items:center'},[T('span',b+'.when','when'),X('education',i)])]),T('span',b+'.org','org')])); });
      var cl=el('ul',{class:'certs'});
      get('certs').forEach(function(c,i){ var b='certs.'+i;
        cl.appendChild(el('li',null,[el(editing?'button':'span',{type:editing?'button':null,class:'status'+(c.status==='Done'?'':' prog'),'data-toggle':editing?b+'.status':null,text:c.status}),T('span',b+'.name'),el('span',{class:'src'},['· ',T('span',b+'.src')]),X('certs',i)])); });
      [ph('cap','Education'),ed,ADD('education','Add education'),
       el('div',{class:'card'},[el('h3',null,[icon('check'),'Certifications & Training']),cl,ADD('certs','Add certificate')])].forEach(function(n){ if(n) p.appendChild(n);});
    } else {
      var c=get('contact'), li=safeUrl(c.linkedin), res=safeUrl(get('resumeUrl'));
      function ct(ic,label,val,copy){ return el('div',{class:'ct'},[el('span',{class:'ic'},[icon(ic)]),el('div',null,[el('small',{text:label}),el('span',{class:'v',text:val})]),copy?el('button',{type:'button',class:'copy','data-copy':val,text:'Copy'}):null]); }
      var grid=el('div',{class:'contacts'},[ct('mail','Email',c.email,true),ct('phone','Phone',c.phone,true),ct('pin','Location',c.location,false),
        el('div',{class:'ct'},[el('span',{class:'ic'},[icon('link')]),el('div',null,[el('small',{text:'LinkedIn'}),li?el('a',{class:'v',href:li,target:'_blank',rel:'noopener',text:li.replace(/^https?:\/\/(www\.)?/,'')}):el('span',{class:'v',text:'Add in Links'})])])]);
      [ph('mail','Contact'),el('p',{class:'lead',text:"I'd love to hear about opportunities in IT support, healthcare administration, office roles and tech. Reach out by email or phone, or connect on LinkedIn."}),grid,
       res?el('a',{class:'btn solid',href:res,target:'_blank',rel:'noopener',style:'align-self:flex-start'},[icon('down'),'Download Resume']):null].forEach(function(n){ if(n) p.appendChild(n);});
      if(editing) p.appendChild(el('p',{class:'lead',style:'color:var(--muted)',text:'Change email, phone, LinkedIn and the resume link under “Links” in the edit bar.'}));
    }
    return p;
  }

  function rightcol(){
    var feat=el('div',{style:'display:flex;flex-direction:column;gap:14px'});
    get('projects').slice(0,2).forEach(function(pr,i){ var u=safeUrl(pr.link);
      feat.appendChild(el('div',{class:'proj'},[el('span',{class:'tile',style:'background:'+TILE[i%3]},[icon(i%2?'work':'code')]),
        el('div',null,[el('b',{text:pr.title}),el('small',{text:pr.desc})]),
        u?el('a',{class:'go',href:u,target:'_blank',rel:'noopener','aria-label':'Open '+pr.title},[icon('arrow')]):el('span',{class:'go off'},[icon('arrow')])])); });
    var skills=el('div',{class:'chips'}); get('skills').forEach(function(s){ skills.appendChild(el('span',{class:'chip',text:s})); });
    return el('div',{class:'rightcol'},[
      el('div',{class:'card'},[el('h3',null,[icon('gear'),'Technical Skills']),skills]),
      el('div',{class:'card'},[el('h3',null,[icon('code'),'Featured Projects']),feat,el('button',{type:'button',class:'btn solid wide','data-go':'projects'},['View All Projects ',icon('right')])])
    ]);
  }

  function editbar(){
    if(!canWrite) return null;
    if(!editing) return el('button',{type:'button',class:'btn solid editfab',id:'edit-open'},[icon('work'),'Edit page']);
    var c=draft.contact;
    var lp = showLinks ? el('div',{class:'linkpanel'},[
      el('label',null,['Email',el('input',{type:'email',id:'ed-email',value:c.email,'data-v':'contact.email'})]),
      el('label',null,['Phone',el('input',{type:'text',id:'ed-phone',value:c.phone,'data-v':'contact.phone'})]),
      el('label',null,['Location',el('input',{type:'text',id:'ed-loc',value:c.location,'data-v':'contact.location'})]),
      el('label',null,['LinkedIn URL',el('input',{type:'url',id:'ed-li',value:c.linkedin,'data-v':'contact.linkedin'})]),
      el('label',{style:'grid-column:1/-1'},['Resume link (Google Drive or similar, shared as "anyone with the link")',el('input',{type:'url',id:'ed-res',value:draft.resumeUrl,placeholder:'https://…','data-v':'resumeUrl'})])
    ]) : null;
    return el('div',{class:'editbar gut'},[el('div',{class:'inner'},[
      el('p',{text:'Editing: click any outlined text to change it. Use + and × to add or remove items.'}),
      el('button',{type:'button',class:'btn ghost',id:'ed-links'},[showLinks?'Hide links':'Links']),
      el('button',{type:'button',class:'btn ghost',id:'ed-cancel'},['Cancel']),
      el('button',{type:'button',class:'btn solid',id:'ed-save'},['Save changes']),lp])]);
  }

  var app=document.getElementById('app');
  function render(){
    var y=window.scrollY;
    app.textContent='';
    document.body.classList.toggle('editing',editing);
    app.appendChild(nav());
    if(tab==='home') app.appendChild(hero());
    else app.appendChild(el('section',{class:'dash gut',id:'dash'},[el('div',{class:'inner'},[panel()])]));
    app.appendChild(el('footer',{class:'gut'},[el('div',{class:'inner',text:'© 2026 '+(get('name')||'')+' · '+(get('contact.location')||'')})]));
    var eb=editbar(); if(eb) app.appendChild(eb);
    if(editing){
      app.querySelectorAll('[data-k]').forEach(function(e){ try{ e.contentEditable='plaintext-only'; }catch(_){ e.contentEditable='true'; } e.spellcheck=true; });
    }
    window.scrollTo(0,y);
    var on=app.querySelector('.links [aria-current="true"]');
    if(on){ var L=on.parentNode; L.scrollLeft=on.offsetLeft-L.offsetLeft-(L.clientWidth-on.offsetWidth)/2; }
  }

  /* ---------- interaction ---------- */
  function setTab(t){
    if(t!=='home' && !TABS.some(function(x){return x[0]===t;})) t='home';
    tab=t; render(); window.scrollTo(0,0);
    try{ history.replaceState(null,'', t==='home' ? location.pathname : '#'+t); }catch(_){}
  }
  var TEMPL={skills:'New skill',softSkills:'New skill',bring:'New strength',achievements:'New achievement',
    projects:{title:'New project',desc:'Short description of what it does',link:''},
    experience:{role:'Role title',org:'Organization, City',when:'Dates',points:['What you did']},
    volunteering:{role:'Volunteer role',org:'Organization, City',when:'Volunteer',points:['What you did']},
    education:{title:'Degree or program',org:'Institution',when:'Dates'},
    certs:{name:'Certificate name',src:'Issuer',status:'Done'}};

  app.addEventListener('click',function(ev){
    var t=ev.target.closest('button,a'); if(!t) return;
    if(t.dataset.go){ setTab(t.dataset.go); return; }
    if(t.dataset.tab){ setTab(t.dataset.tab,false); var b=document.getElementById('tab-'+tab); if(b) b.focus(); return; }
    if(t.dataset.copy!=null){ copy(t.dataset.copy, t.previousElementSibling); return; }
    if(t.id==='edit-open'){ draft=JSON.parse(JSON.stringify(S)); editing=true; render(); toast('Edit mode on'); return; }
    if(t.id==='ed-cancel'){ editing=false; draft=null; showLinks=false; render(); toast('Changes discarded'); return; }
    if(t.id==='ed-links'){ showLinks=!showLinks; render(); return; }
    if(t.id==='ed-save'){ save(t); return; }
    if(t.dataset.del){ var arr=get(t.dataset.del); arr.splice(+t.dataset.i,1); render(); return; }
    if(t.dataset.add){ var path=t.dataset.add, key=path.split('.').pop(); var tpl=key==='points'?'New point':TEMPL[key]; get(path).push(JSON.parse(JSON.stringify(tpl))); render(); return; }
    if(t.dataset.toggle){ setp(t.dataset.toggle, get(t.dataset.toggle)==='Done'?'In progress':'Done'); render(); return; }
  });
  app.addEventListener('input',function(ev){
    if(!editing) return;
    var k=ev.target.closest('[data-k]'); if(k){ setp(k.dataset.k, k.textContent.replace(/ /g,' ')); return; }
    var v=ev.target.closest('[data-v]'); if(v){ setp(v.dataset.v, v.value.trim()); }
  });

  var tt; function toast(m){ var e=document.getElementById('toast'); e.textContent=m; e.hidden=false; clearTimeout(tt); tt=setTimeout(function(){e.hidden=true;},2400); }
  function copy(text, node){
    function fb(){ if(node){ var r=document.createRange(); r.selectNodeContents(node.querySelector('.v')||node); var s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast('Selected. Press Ctrl+C to copy.'); }
    try{ navigator.clipboard.writeText(text).then(function(){toast('Copied');},fb); }catch(_){ fb(); }
  }

  /* initial */
  var h=(location.hash||'').slice(1);
  if(TABS.some(function(x){return x[0]===h;})){ tab=h; }
  render();

})();
</script>
